name: Crocodoc
description: Crocodoc built an HTML5-based document viewing and annotation API that converted PDF,
  Word, PowerPoint, and Excel files into HTML5 for plugin-free, in-browser viewing, embedding, and
  markup. A 500 Startups / Y Combinator-lineage company, Crocodoc was acquired by Box in 2013, and its
  document-rendering technology became the foundation of the Box View API (later Box Content Preview /
  UI Elements). The standalone Crocodoc API was subsequently deprecated and the crocodoc.com domain is
  no longer active. This profile is retained as a historical/acquired-company record in the API
  Evangelist network; there is no live API surface to enrich.
